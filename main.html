
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Parent Example</title>

    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>
<style>
    .family{
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
.child1{
    width: 30%;
    height: 30%;
}
.child2{
    width: 20%;
    height: 20%;
    background-color: aqua;
}

</style>
<body>

    <div class="family">
        <div class="child1">
            <div class="child2">
              
            </div>
        </div>
    </div>

    <script>
        $(".child2").parentsUntil(".family").css("background-color", "red");
    </script>

</body>
</html>
