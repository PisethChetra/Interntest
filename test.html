<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery This Example</title>

    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>
<body>

    <table border="1" cellpadding="10">
        <tr>
            <td>1</td>
            <td>Dara</td>
            <td>20</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Sokha</td>
            <td>21</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Vanna</td>
            <td>22</td>
        </tr>
    </table>

    <script>
        $("tr").click(function() {
            alert($(this).text());
        });
    </script>

</body>
</html>
